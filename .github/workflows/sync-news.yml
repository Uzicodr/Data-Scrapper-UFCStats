name: Sync news

on:
  schedule:
    # Hourly. Publishers update a few times an hour at most, and each run uses about a minute of
    # Actions time, so this stays well inside the free monthly allowance. No LLM calls.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/_run-job.yml
    with:
      command: ufc_agent.agents.sync_news
      timeout-minutes: 10
    secrets: inherit
