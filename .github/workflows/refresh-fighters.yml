name: Refresh fighter profiles

on:
  schedule:
    # After the 10:00 UTC post-event run: new stub fighters and fighters who fought in the last 14 days.
    - cron: "30 11 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-fighters
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/_run-job.yml
    with:
      command: ufc_agent.agents.refresh_fighters
    secrets: inherit
